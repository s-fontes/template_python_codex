[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "python-template"
version = "0.1.0"
description = "Template mínimo para desenvolvimento Python com Codex"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
python-template = "python_template.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8,<10",
    "ruff>=0.15,<1",
]

[tool.uv]
required-version = "==0.12.22"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
strict = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
