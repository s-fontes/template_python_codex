name: Testes Python

"on":
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python fixado
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - name: Configurar uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
      - name: Verificar lock de dependências
        run: uv lock --check
      - name: Instalar projeto e ferramentas de teste
        run: uv sync --locked --no-editable
      - name: Verificar tipos
        run: uv run --locked --no-editable mypy
      - name: Executar testes
        run: uv run --locked --no-editable pytest
      - name: Verificar código
        run: uv run --locked --no-editable ruff check .
      - name: Verificar formatação
        run: uv run --locked --no-editable ruff format --check .
      - name: Validar distribuições
        run: uv build
